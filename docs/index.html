:root{

}
@media(prefers-color-scheme:dark){

}
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:.3rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@keyframes popin{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}
.pop:not([hidden]){animation:popin .16s ease both;transform-origin:top center}
.card{border:1px solid var(--line);border-radius:var(--r);padding:.7rem .8rem;min-width:0;
  transition:border-color .15s,box-shadow .15s,transform .15s}
.skip{position:absolute;left:1rem;top:-3rem;z-index:50;background:var(--btn);color:var(--btn-fg);
  font-size:.82rem;padding:.5rem .9rem;border-radius:.5rem;text-decoration:none;transition:top .15s}
.skip:focus{top:.6rem}
body{margin:0;background:var(--bg);color:var(--fg);

.wrap{max-width:56rem;margin:0 auto;padding:0 1rem 3rem}
h1{font-size:1.6rem;margin:0;letter-spacing:-.02em}
.top{display:flex;align-items:center;justify-content:center;gap:.7rem;margin:clamp(2rem,20svh,13rem) 0 1.2rem}

.links{display:flex;gap:.35rem;flex:none}
.links a{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;

.links a:hover{color:var(--fg);background:var(--soft)}
.links svg{width:1rem;height:1rem}
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);

.search{position:relative;max-width:38rem;margin:0 auto}
.search svg{position:absolute;left:1rem;top:50%;translate:0 -50%;width:1rem;height:1rem;color:var(--muted);pointer-events:none}
.search input{width:100%;font:inherit;font-size:1rem;color:var(--fg);background:var(--soft);

.search input::placeholder{color:var(--muted)}
.search input:focus{background:var(--bg);border-color:var(--line)}
.search input[type=search]::-webkit-search-cancel-button{display:none}
.hero{max-width:38rem;margin:0 auto}
.row{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.7rem;flex-wrap:wrap}
.pop{position:absolute;z-index:50;width:15rem;background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:.75rem;box-shadow:0 12px 32px rgb(0 0 0/.16);padding:.35rem}
.pop::after{content:"";position:absolute;left:var(--ax,50%);bottom:-5px;width:10px;height:10px;

.pop.below::after{bottom:auto;top:-5px;border:0;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%;box-sizing:border-box;

  font:inherit;font-size:.86rem;cursor:pointer;text-decoration:none;text-align:left}
a.opt:hover{background:var(--soft)}
.opt small{color:var(--muted);font-size:.72rem}
.opt.extra{font-size:.8rem}
.opt.off{opacity:.45;cursor:default}
h2{font-size:.9rem;margin:1.3rem 0 .6rem}
#out{scroll-margin-top:10rem}
.grid{display:grid;gap:.6rem;grid-template-columns:1fr;margin:0;padding:0}
.grid>li{list-style:none;min-width:0}
.card{height:100%}

.card{border:1px solid var(--line);border-radius:var(--r);padding:.7rem .8rem;min-width:0;
  transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--muted);box-shadow:0 2px 8px rgb(0 0 0/.06);transform:translateY(-2px)}
.card h3{margin:0;font-size:.9rem}
.card p{margin:.1rem 0 .6rem;font-size:.74rem;color:var(--muted)}
.act{display:flex;flex-direction:column;gap:.4rem}
.act button,.act a{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;

.act button svg,.act a svg{width:.9rem;height:.9rem;flex:none}
.copy{font:inherit;font-size:.8rem;font-weight:500;padding:.5rem .6rem;background:var(--btn)!important;
  border-color:transparent!important;color:var(--btn-fg)!important;width:100%;transition:background .2s}
.copy.ok{background:var(--ok)!important;color:#fff!important}
.prov{display:grid;grid-template-columns:repeat(2,1fr);gap:.35rem}
.prov button,.prov a{font:inherit;font-size:.76rem;font-weight:500;padding:.48rem .1rem;min-width:0}
.prov button:hover,.prov a:hover{background:var(--soft)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.85rem}
.empty button{margin-top:.5rem;font:inherit;font-size:.8rem;background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:.45rem;padding:.4rem 1rem;cursor:pointer}

  const r=popAnchor.getBoundingClientRect();

  let left=Math.min(Math.max(8,r.left+r.width/2-pw/2),innerWidth-pw-8);
  let top=r.top+scrollY-ph-10;
  const below=top<scrollY+4;
  if(below)top=r.bottom+scrollY+10;
  p.classList.toggle("below",below);
  p.style.left=left+"px";p.style.top=top+"px";
  p.style.setProperty("--ax",(r.left+r.width/2-left)+"px");
}
function openPop(anchor,prov,hrefFor,dl,avail,flash,nm){
  if(popAnchor===anchor&&!$("pop").hidden){closePop(true);return;}
  popAnchor=anchor;
  const box=$("popOpts");box.innerHTML="";
  for(const [k,label] of KINDS){
    const miss=(k==="lectures"&&!avail.l)||(k==="practices"&&!avail.p);
    if(miss){
      const s=document.createElement("span");s.className="opt off";
      s.innerHTML=`<span>${label}</span><small>нет файла</small>`;box.appendChild(s);continue;
    }
    if(flash){
      const b=document.createElement("button");b.className="opt";b.textContent=label;
      b.onclick=()=>{copy(hrefFor(k),flash);closePop(false);};box.appendChild(b);continue;
    }
    const a=document.createElement("a");a.className="opt";a.textContent=label;a.href=hrefFor(k);
    if(dl)a.setAttribute("download","");
    else if(prov!=="Apple"){a.target="_blank";a.rel="noopener";}
    box.appendChild(a);
  }
  const extra=(label,href)=>{
    const a=document.createElement("a");a.className="opt extra";a.href=href;
    a.target="_blank";a.rel="noopener";
    a.innerHTML=`<span>${label}</span><small>↗</small>`;box.appendChild(a);
  };
  if(prov==="Google")extra("Не сработало? Вставить вручную","https://calendar.google.com/calendar/u/0/r/settings/addbyurl?pli=1");
  if(prov==="Outlook")extra("Outlook 365 (рабочий аккаунт)",ocal365(hrefFor("unified"),"ITIS "+nm));
  const p=$("pop");p.hidden=false;
  placePop();
  const first=box.querySelector(".opt:not(.off)");
  if(first)first.focus();
}
document.addEventListener("pointerdown",e=>{
  const p=$("pop");
  if(!p.hidden&&!p.contains(e.target))closePop(false);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("pop").hidden){e.stopPropagation();closePop(true);}
});
addEventListener("scroll",()=>placePop(),{passive:true,capture:true});
addEventListener("resize",()=>placePop());
function card(t,w,urlFor,avail,nm){
  const id="c"+(++uid);
  const li=document.createElement("li");
  li.innerHTML=`<article class="card" aria-labelledby="${id}">
<div><h3 id="${id}">${t}</h3>${w?`<p>${w}</p>`:""}</div><div class="act">
<button class="copy" aria-label="Скопировать «${t}»: выбрать тип календаря">${I.copy}<span aria-hidden="true">Скопировать</span></button>
<div class="prov">
<button data-p="Google" aria-label="Добавить «${t}» в Google Календарь">${I.google}<span aria-hidden="true">Google</span></button>
<button data-p="Apple" aria-label="Открыть «${t}» в Apple Календаре">${I.apple}<span aria-hidden="true">Apple</span></button>
<button data-p="Outlook" aria-label="Открыть «${t}» в Outlook">${I.outlook}<span aria-hidden="true">Outlook</span></button>
<button data-p="ICS" aria-label="Скачать «${t}» (.ics)">${I.dl}<span aria-hidden="true">ICS</span></button>
</div></div></article>`;
  const btns=li.getElementsByTagName("button");
  const [btn,bg,ba,bo,bi]=btns;
  btn.onclick=()=>openPop(btn,"copy",k=>urlFor(k),false,avail,btn,nm);
  bg.onclick=()=>openPop(bg,"Google",k=>gcal(urlFor(k)),false,avail,null,nm);
  ba.onclick=()=>openPop(ba,"Apple",k=>urlFor(k).replace(/^https:\/\//,"webcal://"),false,avail,null,nm);
  bo.onclick=()=>openPop(bo,"Outlook",k=>ocal(urlFor(k),"ITIS "+nm),false,avail,null,nm);
  bi.onclick=()=>openPop(bi,"ICS",k=>urlFor(k),true,avail,null,nm);
  return li;
}
let nsec=0;
function render(){
  build();applyFilter();
}
function mksec(t){
  const o=$("out");
  const s=document.createElement("section");
  const h=document.createElement("h2");h.textContent=t;h.id="sec"+(++nsec);
  s.setAttribute("aria-labelledby",h.id);s.appendChild(h);
  const d=document.createElement("ul");d.className="grid";s.appendChild(d);o.appendChild(s);
  S._secs.push({sec:s,grid:d});return s;
}
function build(){
  closePop(false);
  const o=$("out");o.innerHTML="";uid=0;nsec=0;
  S._gli=[];S._tli=[];S._secs=[];
  const gs=mksec("Группы");
  for(const g of S.g){
    const li=card(g.n,g.s?`${g.s} студ.`:"",k=>gurl(g.n,k),{l:g.l,p:g.p},g.n);
    gs.lastChild.appendChild(li);S._gli.push({el:li,g});
  }
  const ssec=mksec("Студенты");
  for(const t of S.s){
    const g=S.g.find(x=>x.n===t.g);
    const li=card(t.n,t.g,k=>surl(t.f,k),g?{l:g.l,p:g.p}:{l:true,p:true},t.g);
    ssec.lastChild.appendChild(li);S._tli.push({el:li,t});
  }
}
function applyFilter(){
  const q=norm($("q").value);
  let gv=0,tv=0;
  for(const {el,g} of S._gli){const show=!!q&&norm(g.n).includes(q);el.hidden=!show;if(show)gv++;}
  for(const {el,t} of S._tli){
    const show=!!q&&(norm(t.n).includes(q)||norm(t.g).includes(q))&&tv<60;
    el.hidden=!show;if(show)tv++;
  }
  for(const s of S._secs)s.sec.hidden=![...s.grid.children].some(li=>!li.hidden);
  const none=gv+tv===0;
  $("empty").hidden=!none;
  $("reset").hidden=!q;
  $("emptyMsg").textContent=!q?"Введи группу или фамилию":"Ничего не найдено";
}
$("q").addEventListener("input",applyFilter);
$("reset").onclick=()=>{$("q").value="";applyFilter();};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("pop").hidden)return;
  if(e.key==="Escape"&&document.activeElement===$("q")){$("q").value="";applyFilter();}});
const P=new URLSearchParams(location.search);
if(P.get("q"))$("q").value=P.get("q");else if(P.get("group"))$("q").value=P.get("group");
if(SNAPSHOT){load(SNAPSHOT);sortG();render();}
live();
</script>
