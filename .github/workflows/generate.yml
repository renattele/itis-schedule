name: Generate Schedules

on:
  schedule:
    # Run every 5 hours
    - cron: "0 */5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    # Skip re-runs triggered by our own README refresh commits.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Refresh README tables')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t itis-schedule .

      - name: Run tests
        run: docker run --rm --entrypoint pytest itis-schedule tests/ -q

      - name: Generate iCal files
        run: |
          rm -rf calendars/*
          mkdir -p calendars
          docker run --rm \
            -v ${{ github.workspace }}/calendars:/app/calendars \
            -v ${{ github.workspace }}/overrides.json:/app/overrides.json \
            itis-schedule \
            --split-types \
            --overrides /app/overrides.json

      - name: Refresh README and site snapshot
        run: |
          python3 src/sitegen.py --calendars-dir ./calendars
          cp docs/index.html calendars/index.html

      - name: Set commit timestamp
        id: commit_ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Deploy calendars
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./calendars
          publish_branch: calendars
          force_orphan: true
          commit_message: "📅 Update schedule calendars [${{ steps.commit_ts.outputs.value }}]"

      - name: Commit refreshed README and site snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.html
          git diff --cached --quiet || git commit -m "📝 Refresh README tables + site snapshot"
          git push
